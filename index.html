<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hey, Akankhya.</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<meta property="og:title" content="Hey, Akankhya.">
<meta property="og:description" content="something made for you.">
<meta property="og:image" content="https://YOUR-NETLIFY-URL.netlify.app/images/hamster-main.jpg">
<meta property="og:type" content="website">

</head>
<body>

<div class="header">
  <p class="header-label">made for you</p>
  <div class="hamster-wrap">
    <img class="hamster-main" src="images/hamster-main.jpg" alt="hamster">
  </div>
  <h1>Hey, <span>Akankhya.</span></h1>
  <p class="header-sub">here's your thing for today.</p>
</div>

<div class="divider"></div>

<!-- SONGS -->
<div class="section">
  <p class="section-label">today you're listening to</p>
  <div class="songs-grid" id="songs-grid"></div>
</div>

<!-- SKETCH -->
<div class="section">
  <p class="section-label">today's sketch</p>
  <div class="sketch-card">
    <div class="sketch-icon">✏️</div>
    <p class="sketch-prompt" id="sketch-prompt">Loading...</p>
    <p class="sketch-sub">you have full creative control. go do it.</p>
  </div>
</div>

<!-- MOOD -->
<div class="section">
  <p class="section-label">check in</p>
  <div class="mood-card">
    <p class="mood-question">how are you feeling today?</p>
    <div class="mood-options">
      <button class="mood-btn" onclick="pickMood(this, 'I\'m good ♡')" data-mood="I'm good ♡">
        <img src="images/hamster-happy.jpg" alt="good">
        <span class="mood-label">I'm good ♡</span>
      </button>
      <button class="mood-btn" onclick="pickMood(this, 'I\'m surviving lol')" data-mood="I'm surviving lol">
        <img src="images/hamster-okay.jpg" alt="okay">
        <span class="mood-label">I'm surviving lol</span>
      </button>
      <button class="mood-btn" onclick="pickMood(this, 'not my day')" data-mood="not my day">
        <img src="images/hamster-sad.jpg" alt="sad">
        <span class="mood-label">not my day</span>
      </button>
    </div>
    <div class="mood-result" id="mood-result">
      <p class="mood-confirm-text" id="mood-confirm"></p>
      <a id="insta-link" class="insta-btn" href="#" target="_blank">
        <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
        tell Cymero 👀
      </a>
    </div>
  </div>
</div>

<!-- TIMER -->
<div class="section">
  <p class="section-label">the deadline</p>
  <div class="timer-card">
    <p class="timer-label">time remaining</p>
    <div class="timer-display" id="timer-display">00:00:00</div>
    <p class="timer-joke">you have 24 hours. haha.</p>
  </div>
</div>

<!-- NOTE -->
<div class="section">
  <div class="note-card">
    <p class="note-text" id="daily-note">—</p>
    <p class="note-from">— Cymero</p>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
